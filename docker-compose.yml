services:
  mangayomi:
    # Published image. Pin a release tag or digest in .env for reproducible
    # deployments. To build from source instead, use docker-compose.dev.yml.
    image: ${MANGAYOMI_IMAGE:-yexca/mangayomi:latest}
    container_name: mangayomi
    restart: unless-stopped
    ports:
      - "${MANGAYOMI_PORT:-7652}:7652"
    environment:
      # User/group that owns your manga files on the NAS (run `id` to find them).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      MANGAYOMI_DEBUG: ${MANGAYOMI_DEBUG:-}
    volumes:
      # Database and cover cache.
      - ./config:/config
      # Your manga. Point this at the NAS share, e.g. /path/to/manga:/data.
      # Must be writable for the delete feature to work.
      - ./data:/data
